<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veynt Books – Product Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ============================================================
             🌐 ROOT VARIABLES — SAME AS MAIN SITE (so theme stays connected)
             ============================================================ */
        :root {
            --bg-primary: #f5efe6;
            --bg-secondary: #ece3d8;
            --bg-card: rgba(245, 239, 230, 0.88);
            --text-primary: #2c241a;
            --text-dark: #1a1410;
            --text-light: #4a3f35;
            --text-sub: #6b5f53;
            --accent-gold: #c9a87c;
            --accent-gold-dark: #b8946a;
            --accent-gold-light: #e0ceb8;
            --border-color: #dcd0c2;
            --shadow: rgba(44, 36, 26, 0.10);
            --shadow-hover: rgba(44, 36, 26, 0.16);
            --font-serif: 'Georgia', 'Times New Roman', serif;
            --font-sans: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --paper-texture: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a87c' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        /* ===== DARK MODE (same key/values as main site) ===== */
        [data-theme="dark"] {
            --bg-primary: #1c1712;
            --bg-secondary: #2a231d;
            --bg-card: rgba(30, 25, 20, 0.90);
            --text-primary: #ece3d8;
            --text-dark: #f0e6d8;
            --text-light: #d4c8b8;
            --text-sub: #b0a090;
            --accent-gold: #c9a87c;
            --accent-gold-dark: #b8946a;
            --accent-gold-light: #d4c0a8;
            --border-color: #3d352c;
            --shadow: rgba(0, 0, 0, 0.3);
            --shadow-hover: rgba(0, 0, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            background-image: var(--paper-texture);
            color: var(--text-dark);
            transition: background-color var(--transition), color var(--transition);
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 30% 20%, rgba(201, 168, 124, 0.06), transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(201, 168, 124, 0.04), transparent 50%);
            z-index: 0; pointer-events: none;
        }

        /* ============================================================
             🌙 THEME TOGGLE + BACK BUTTON (top bar, same style as main site)
             ============================================================ */
        .theme-toggle-btn, .back-btn {
            position: absolute; top: 20px; z-index: 10000;
            background: var(--bg-secondary);
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 22px;
            padding: 8px 12px;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 4px 20px var(--shadow);
            line-height: 1;
        }
        .back-btn { left: 20px; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .theme-toggle-btn { right: 20px; }
        .theme-toggle-btn:hover, .back-btn:hover {
            background: var(--accent-gold);
            color: var(--bg-primary);
            transform: scale(1.05);
        }

        .main-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 90px 20px 50px;
            position: relative;
            z-index: 1;
        }

        /* ============================================================
             📄 PRODUCT DETAIL GRID
             ============================================================ */
        .product-detail {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 30px 32px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            margin-bottom: 40px;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        /* ============================================================
             🎞️ BOOK PREVIEW SLIDESHOW (Flipkart/Amazon style)
             ============================================================ */
        .preview-slider {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            aspect-ratio: 2/3;
            max-width: 420px;
        }
        .slider-track {
            display: flex;
            height: 100%;
            transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .slider-track img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
        }
        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            background: var(--bg-card);
            color: var(--accent-gold);
            font-size: 16px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all var(--transition);
            z-index: 5;
        }
        .slider-arrow:hover { background: var(--accent-gold); color: var(--bg-primary); }
        .slider-arrow.prev { left: 10px; }
        .slider-arrow.next { right: 10px; }
        .slider-dots {
            position: absolute;
            bottom: 12px; left: 0; right: 0;
            display: flex; justify-content: center; gap: 6px;
            z-index: 5;
        }
        .slider-dots .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: rgba(255,255,255,0.5);
            border: 1px solid var(--accent-gold);
            cursor: pointer;
            transition: all var(--transition);
        }
        .slider-dots .dot.active { background: var(--accent-gold); width: 20px; border-radius: 5px; }
        .preview-label {
            text-align: center;
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        /* ============================================================
             📘 PRODUCT INFO
             ============================================================ */
        .detail-info h1 {
            font-family: var(--font-serif);
            font-size: clamp(26px, 3vw, 34px);
            color: var(--text-primary);
            margin-bottom: 6px;
            line-height: 1.25;
        }
        .detail-meta { font-size: 14px; color: var(--text-sub); margin-bottom: 10px; }
        .detail-meta span { margin-right: 16px; }
        .detail-rating {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        .detail-rating .stars { color: #facc15; font-size: 18px; }
        .detail-rating .rating-badge {
            background: var(--accent-gold);
            color: var(--bg-primary);
            font-weight: 700;
            font-size: 13px;
            padding: 3px 10px;
            border-radius: 20px;
        }
        .detail-rating .rating-count { font-size: 13px; color: var(--text-sub); }

        .detail-price {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin: 6px 0 4px;
        }
        .detail-price .current { font-size: 30px; font-weight: 800; color: var(--accent-gold); }
        .detail-price .original { font-size: 18px; color: var(--text-sub); text-decoration: line-through; opacity: 0.65; }
        .detail-price .discount { font-size: 14px; font-weight: 700; color: #8b9a6b; }
        .price-note { font-size: 12px; color: var(--text-sub); margin-bottom: 16px; opacity: 0.8; }

        .detail-tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 16px; }
        .detail-tags span {
            font-size: 12px;
            background: rgba(201, 168, 124, 0.12);
            color: var(--accent-gold);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(201, 168, 124, 0.15);
        }
        .detail-description { font-size: 15.5px; line-height: 1.8; color: var(--text-sub); margin-bottom: 20px; }

        .action-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .btn-buy-lg {
            padding: 14px 42px;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-dark));
            color: var(--bg-primary);
            font-weight: 700;
            font-size: 17px;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-buy-lg:hover { transform: scale(1.03); box-shadow: 0 8px 30px rgba(201, 168, 124, 0.3); }
        .btn-share-lg {
            padding: 14px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 60px;
            color: var(--text-sub);
            cursor: pointer;
            transition: all var(--transition);
            font-size: 17px;
        }
        .btn-share-lg:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

        /* ============================================================
             ⭐ RATINGS & REVIEWS
             ============================================================ */
        .reviews-section {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 28px 30px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            margin-bottom: 40px;
        }
        .reviews-section h2 {
            font-family: var(--font-serif);
            font-size: 24px;
            color: var(--accent-gold);
            margin-bottom: 20px;
            border-left: 4px solid var(--accent-gold);
            padding-left: 15px;
        }
        .rating-summary {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 30px;
            margin-bottom: 24px;
            align-items: center;
        }
        .rating-summary .big-score { text-align: center; }
        .rating-summary .big-score .num { font-size: 44px; font-weight: 800; color: var(--text-primary); font-family: var(--font-serif); }
        .rating-summary .big-score .stars { color: #facc15; font-size: 18px; margin: 4px 0; }
        .rating-summary .big-score .count { font-size: 13px; color: var(--text-sub); }
        .rating-bars .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        .rating-bars .bar-row span:first-child { font-size: 12px; color: var(--text-sub); width: 40px; }
        .rating-bars .bar-track { flex: 1; height: 8px; background: var(--bg-secondary); border-radius: 10px; overflow: hidden; }
        .rating-bars .bar-fill { height: 100%; background: var(--accent-gold); border-radius: 10px; }
        .rating-bars .bar-row span:last-child { font-size: 12px; color: var(--text-sub); width: 34px; text-align: right; }

        .review-list { border-top: 2px solid var(--border-color); padding-top: 16px; }
        .review-item { padding: 14px 0; border-bottom: 1px solid var(--border-color); }
        .review-item:last-child { border-bottom: none; }
        .review-item .reviewer { font-weight: 700; color: var(--text-primary); font-size: 15px; }
        .review-item .review-date { font-size: 12px; color: var(--text-sub); margin-left: 10px; }
        .review-item .review-stars { color: #facc15; font-size: 14px; margin: 4px 0; }
        .review-item .review-text { color: var(--text-sub); font-size: 14.5px; line-height: 1.6; }

        /* ============================================================
             📚 SIMILAR PRODUCTS
             ============================================================ */
        .similar-books h2 {
            font-family: var(--font-serif);
            font-size: 24px;
            color: var(--accent-gold);
            margin-bottom: 20px;
            border-left: 4px solid var(--accent-gold);
            padding-left: 15px;
        }
        .similar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 20px;
        }
        .similar-card {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            transition: all var(--transition);
            cursor: pointer;
        }
        .similar-card:hover { transform: translateY(-4px); border-color: var(--accent-gold); box-shadow: var(--shadow-hover); }
        .similar-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 10px; margin-bottom: 8px; background: var(--bg-secondary); }
        .similar-card h4 { font-size: 13.5px; font-weight: 600; color: var(--text-primary); line-height: 1.3; min-height: 34px; }
        .similar-card .similar-price { font-size: 14px; font-weight: 700; color: var(--accent-gold); margin-top: 4px; }
        .similar-card .similar-original { font-size: 11px; color: var(--text-sub); text-decoration: line-through; opacity: 0.6; margin-left: 4px; }

        /* ============================================================
             📱 RESPONSIVE
             ============================================================ */
        @media (max-width: 900px) {
            .detail-grid { grid-template-columns: 1fr; }
            .preview-slider { max-width: 100%; }
            .rating-summary { grid-template-columns: 1fr; text-align: center; }
        }
        @media (max-width: 600px) {
            .main-container { padding: 80px 14px 30px; }
            .product-detail, .reviews-section { padding: 20px 16px; }
            .theme-toggle-btn, .back-btn { top: 14px; font-size: 18px; padding: 6px 10px; }
            .back-btn span.label { display: none; }
            .detail-price .current { font-size: 24px; }
            .btn-buy-lg { flex: 1; justify-content: center; padding: 13px 20px; font-size: 15px; }
            .similar-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
        }
    </style>
</head>
<body>

    <a href="VEYNT_STORE.html" class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i> <span class="label">Back to Store</span></a>
    <button class="theme-toggle-btn" id="themeToggle" aria-label="Toggle Theme">🌙</button>

    <div class="main-container">
        <div id="productRoot"><!-- product detail injected here by JS --></div>

        <div class="reviews-section" id="reviewsRoot"><!-- reviews injected here by JS --></div>

        <div class="similar-books">
            <h2>📖 Similar Books You May Like</h2>
            <div class="similar-grid" id="similarGrid"><!-- similar products injected here --></div>
        </div>
    </div>

    <script>
        // ============================================================
        // 📚 PRODUCT DATA
        // ============================================================
        const products = [
            {
                id: 1,
                title: "When Giants Ruled the Earth",
                category: "dinosaurs",
                tags: ["Dinosaurs", "3D", "Audio"],
                cover: "https://picsum.photos/seed/dino1/400/600",
                previewImages: [
                    "https://picsum.photos/seed/dino1a/400/600",
                    "https://picsum.photos/seed/dino1b/400/600",
                    "https://picsum.photos/seed/dino1c/400/600",
                    "https://picsum.photos/seed/dino1d/400/600"
                ],
                price: 399,
                originalPrice: 799,
                desc: "Explore the world of dinosaurs with 3D models, audio narration, and interactive quizzes. A complete journey through the age of giants — built for curious minds of every age.",
                rating: 4.9,
                ratingCount: 234,
                ratingBreakdown: { 5: 190, 4: 30, 3: 9, 2: 3, 1: 2 },
                buyLink: "#",
                reviews: [
                    { name: "Rahul S.", stars: 5, date: "12 Aug 2026", text: "Amazing book! My son loved the 3D models and audio narration." },
                    { name: "Priya M.", stars: 5, date: "05 Aug 2026", text: "Beautifully designed and genuinely educational. Worth every rupee." },
                    { name: "Aakash T.", stars: 4, date: "02 Aug 2026", text: "Great content, would love even more quiz sections." }
                ]
            },
            {
                id: 2,
                title: "Evolutionary Dead Ends",
                category: "evolution",
                tags: ["Evolution", "Biology", "Educational"],
                cover: "mybook.jpg",
                previewImages: ["mybook.jpg"],
                price: 299,
                originalPrice: 499,
                desc: "Explore evolutionary experiments that disappeared from the tree of life — a fascinating look at biology's forgotten branches.",
                rating: 4.8,
                ratingCount: 50,
                ratingBreakdown: { 5: 15, 4: 9, 3: 2, 2: 1, 1: 0 },
                buyLink: "#",
                reviews: []
            }
            
        ];

        // ============================================================
        // 🧠 STATE
        // ============================================================
        let currentProduct = null;
        let slideIndex = 0;

        // ============================================================
        // 🔗 PICK PRODUCT FROM URL
        // ============================================================
        // Works with either: product.html?id=2  OR  product.html#2
        function getRequestedId() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('id')) return parseInt(params.get('id'));
            const hash = window.location.hash.replace('#', '');
            if (hash) return parseInt(hash);
            return products[0].id;
        }

        function loadProduct(id) {
            const found = products.find(p => p.id === id) || products[0];
            currentProduct = found;
            slideIndex = 0;
            renderProduct();
            renderReviews();
            renderSimilar();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================================
        // 🎞️ SLIDESHOW HELPERS
        // ============================================================
        function goToSlide(i) {
            const imgs = currentProduct.previewImages;
            slideIndex = (i + imgs.length) % imgs.length;
            const track = document.getElementById('sliderTrack');
            if (track) track.style.transform = `translateX(-${slideIndex * 100}%)`;
            document.querySelectorAll('.slider-dots .dot').forEach((d, idx) => d.classList.toggle('active', idx === slideIndex));
        }
        function nextSlide() { goToSlide(slideIndex + 1); }
        function prevSlide() { goToSlide(slideIndex - 1); }

        // ============================================================
        // 🖥️ RENDER: PRODUCT DETAIL
        // ============================================================
        function renderProduct() {
            const p = currentProduct;
            const discount = Math.round((1 - p.price / p.originalPrice) * 100);
            const starsFull = Math.floor(p.rating);
            const stars = '★'.repeat(starsFull) + '☆'.repeat(5 - starsFull);

            document.getElementById('productRoot').innerHTML = `
                <div class="product-detail">
                    <div class="detail-grid">
                        <div>
                            <div class="preview-slider">
                                <div class="slider-track" id="sliderTrack">
                                    ${p.previewImages.map(img => `<img src="${img}" alt="${p.title} preview" />`).join('')}
                                </div>
                                ${p.previewImages.length > 1 ? `
                                    <button class="slider-arrow prev" onclick="prevSlide()"><i class="fas fa-chevron-left"></i></button>
                                    <button class="slider-arrow next" onclick="nextSlide()"><i class="fas fa-chevron-right"></i></button>
                                    <div class="slider-dots">
                                        ${p.previewImages.map((_, idx) => `<span class="dot ${idx === 0 ? 'active' : ''}" onclick="goToSlide(${idx})"></span>`).join('')}
                                    </div>
                                ` : ''}
                            </div>
                            <div class="preview-label">📖 Swipe or use the arrows to preview book pages</div>
                        </div>
                        <div class="detail-info">
                            <h1>${p.title}</h1>
                            <div class="detail-meta">
                                <span><i class="fas fa-tag"></i> ${p.category.toUpperCase()}</span>
                            </div>
                            <div class="detail-rating">
                                <span class="stars">${stars}</span>
                                <span class="rating-badge">${p.rating} / 5</span>
                                <span class="rating-count">${p.ratingCount} ratings</span>
                            </div>
                            <div class="detail-price">
                                <span class="current">$${p.price}</span>
                                <span class="original">$${p.originalPrice}</span>
                                <span class="discount">${discount}% off</span>
                            </div>
                            <div class="price-note">Inclusive of all taxes • Instant digital delivery</div>
                            <div class="detail-tags">${p.tags.map(t => `<span>${t}</span>`).join('')}</div>
                            <p class="detail-description">${p.desc}</p>
                            <div class="action-row">
                                <a href="${p.buyLink}" target="_blank" class="btn-buy-lg"><i class="fas fa-shopping-bag"></i> Buy Now</a>
                                <button class="btn-share-lg" onclick="shareProduct()" title="Share this book"><i class="fas fa-share-alt"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ============================================================
        // 🖥️ RENDER: REVIEWS
        // ============================================================
        function renderReviews() {
            const p = currentProduct;
            const total = Object.values(p.ratingBreakdown).reduce((a, b) => a + b, 0) || 1;
            const stars = '★'.repeat(Math.floor(p.rating)) + '☆'.repeat(5 - Math.floor(p.rating));

            const bars = [5, 4, 3, 2, 1].map(star => {
                const count = p.ratingBreakdown[star] || 0;
                const pct = Math.round((count / total) * 100);
                return `
                    <div class="bar-row">
                        <span>${star} ★</span>
                        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
                        <span>${count}</span>
                    </div>
                `;
            }).join('');

            const reviewsHtml = p.reviews.length > 0 ? p.reviews.map(r => `
                <div class="review-item">
                    <span class="reviewer">${r.name}</span><span class="review-date">${r.date}</span>
                    <div class="review-stars">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}</div>
                    <div class="review-text">${r.text}</div>
                </div>
            `).join('') : `<div class="review-item"><div class="review-text">No reviews yet — be the first to review this book!</div></div>`;

            document.getElementById('reviewsRoot').innerHTML = `
                <h2>⭐ Ratings &amp; Reviews</h2>
                <div class="rating-summary">
                    <div class="big-score">
                        <div class="num">${p.rating}</div>
                        <div class="stars">${stars}</div>
                        <div class="count">${p.ratingCount} ratings</div>
                    </div>
                    <div class="rating-bars">${bars}</div>
                </div>
                <div class="review-list">${reviewsHtml}</div>
            `;
        }

        // ============================================================
        // 🖥️ RENDER: SIMILAR PRODUCTS (same category, excluding current)
        // ============================================================
        function renderSimilar() {
            const p = currentProduct;
            const similar = products.filter(b => b.id !== p.id && b.category === p.category).slice(0, 20);
            const grid = document.getElementById('similarGrid');

            if (similar.length === 0) {
                grid.innerHTML = `<div style="color:var(--text-sub);grid-column:1/-1;text-align:center;padding:20px;">No similar books yet.</div>`;
                return;
            }

            grid.innerHTML = similar.map(b => `
                <div class="similar-card" onclick="navigateToProduct(${b.id})">
                    <img src="${b.cover}" alt="${b.title}" loading="lazy" />
                    <h4>${b.title}</h4>
                    <div class="similar-price">$${b.price}<span class="similar-original">$${b.originalPrice}</span></div>
                </div>
            `).join('');
        }

        function navigateToProduct(id) {
            window.location.href = `PRODUCT DETAIL PAGE.html?id=${id}`;
        }

        // ============================================================
        // 📤 SHARE
        // ============================================================
        function shareProduct() {
            const p = currentProduct;
            const text = `📚 Check out "${p.title}" – an interactive digital book!`;
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({ title: p.title, text: text, url: url }).catch(() => {});
            } else {
                navigator.clipboard.writeText(`${text}\n\n🔗 ${url}`).catch(() => {});
            }
        }

        // ============================================================
        // 🌙 THEME — AUTO-SYNCED WITH MAIN SITE
        // Same localStorage key ("veyntTheme") as the main store site.
        // 1) On load, this page picks up whatever theme the main site last set.
        // 2) It also listens for live changes (e.g. theme changed on the main
        //    site in another tab) and updates instantly, no reload needed.
        // 3) The toggle button here still works and updates the same shared key,
        //    so switching theme here also updates the main site's theme.
        // ============================================================
        const themeToggleBtn = document.getElementById('themeToggle');

        function applyTheme(theme) {
            if (theme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                themeToggleBtn.textContent = '☀️';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggleBtn.textContent = '🌙';
            }
        }

        applyTheme(localStorage.getItem('veyntTheme') || 'dark');

        themeToggleBtn.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            applyTheme(next);
            localStorage.setItem('veyntTheme', next);
        });

        // Live sync: fires when 'veyntTheme' changes in another tab/window
        // (e.g. the user toggles theme on the main VEYNT_BOOKS_STORE.html tab)
        window.addEventListener('storage', (e) => {
            if (e.key === 'veyntTheme' && e.newValue) {
                applyTheme(e.newValue);
            }
        });

        // ============================================================
        // 👆 SWIPE SUPPORT FOR SLIDESHOW (mobile)
        // ============================================================
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => {
            if (e.target.closest('.preview-slider')) touchStartX = e.changedTouches[0].screenX;
        });
        document.addEventListener('touchend', (e) => {
            if (!e.target.closest('.preview-slider')) return;
            const touchEndX = e.changedTouches[0].screenX;
            const diff = touchEndX - touchStartX;
            if (Math.abs(diff) > 40) {
                if (diff < 0) nextSlide(); else prevSlide();
            }
        });

        // ============================================================
        // 🔙 BACK BUTTON — EDIT "VEYNT_BOOKS_STORE.html" BELOW IF YOUR MAIN
        // FILE HAS A DIFFERENT NAME
        // ============================================================
        document.getElementById('backBtn').addEventListener('click', (e) => {
            if (document.referrer && document.referrer.includes(window.location.host)) {
                e.preventDefault();
                window.history.back();
            }
            // otherwise falls through to href="VEYNT_BOOKS_STORE.html"
        });

        // ============================================================
        // 🌐 ROUTING — react to hash/query changes without full reload
        // ============================================================
        window.addEventListener('hashchange', () => loadProduct(getRequestedId()));

        // ============================================================
        // 🚀 INIT
        // ============================================================
        loadProduct(getRequestedId());
    </script>
</body>
</html>
